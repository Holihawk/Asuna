[tool.ruff]
target-version = "py310"
line-length = 100
include = ["tools/**/*.py", "tests/ext_test.py"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "RUF100"]

[tool.pyright]
include = ["tools"]
exclude = ["**/__pycache__"]
pythonVersion = "3.10"
typeCheckingMode = "basic"

# PyGObject exposes gi.repository modules dynamically after require_version();
# without third-party stubs, those imports cannot be checked statically.
reportMissingImports = "none"
reportMissingModuleSource = "none"
